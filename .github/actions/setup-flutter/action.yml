name: Set up workspace Flutter
description: Install FVM and restore SDK and Pub caches, then resolve the workspace.
runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1
    - name: Configure SDK cache
      shell: bash
      run: echo "FVM_CACHE_PATH=$RUNNER_TOOL_CACHE/fvm" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/fvm
        key: fvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fvmrc') }}
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fvmrc') }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fvmrc') }}-
    - name: Install FVM and project SDK
      shell: bash
      run: |
        dart pub global activate fvm 4.1.0
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        "$HOME/.pub-cache/bin/fvm" install --skip-pub-get
    - name: Resolve workspace dependencies
      shell: bash
      run: fvm flutter pub get
